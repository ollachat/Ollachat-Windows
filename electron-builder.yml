appId: com.ollacore.chat.desktop
productName: OllaChat
copyright: Copyright © 2026 Ollacore

protocols:
  - name: OllaChat Protocol
    schemes:
      - ollachat

directories:
  output: release
  buildResources: build

files:
  - from: .
    filter:
      - dist/**/*
      - package.json
      - node_modules/undici/**/*
      - node_modules/sqlite3/**/*
      - node_modules/bindings/**/*
      - node_modules/file-uri-to-path/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  signAndEditExecutable: false
  forceCodeSigning: false

mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing/notarization: set CSC_LINK/CSC_KEY_PASSWORD (Developer ID cert) and
  # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID, then flip notarize to true.
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: OllaChat needs microphone access for voice and video calls.
    NSCameraUsageDescription: OllaChat needs camera access for video calls.
    NSAudioCaptureUsageDescription: OllaChat needs audio capture access to share system audio during calls.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OllaChat

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
